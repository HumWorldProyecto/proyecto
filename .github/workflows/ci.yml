name: Primer Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: humworld
          POSTGRES_PASSWORD: humworld
          POSTGRES_DB: humworld
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U humworld"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://humworld:humworld@localhost:5432/humworld?schema=public"
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Compilar backend
        run: npm run build

      - name: Aplicar migraciones de Prisma
        run: npx prisma migrate deploy

      - name: Verificar generación de informes JUnit
        run: npm run test:reporter

      - name: Ejecutar pruebas con cobertura (unitarias + integración)
        run: npm run test:ci

      - name: Publicar informes de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-pruebas-backend
          path: backend/reports/
          if-no-files-found: warn
          retention-days: 7

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: 1 Mostrar contexto
        run: |
          echo "Repositorio: $GITHUB_REPOSITORY"
          echo "Commit: $GITHUB_SHA"

      - name: 2 Comprobación inicial
        run: test -f README.md

      - name: Resultado final
        if: success()
        run: echo "OK - Todos los pasos se completaron exitosamente"

      - name: Notificación de error
        if: failure()
        run: |
          echo "KO ERROR - Fallo en uno de los pasos anteriores"
          exit 1

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:cov

  openspec-sprint4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - run: npx --yes @fission-ai/openspec@1.14.3 validate sprint4-consultas-visualizaciones --strict
      - run: npx --yes @fission-ai/openspec@1.14.3 validate proteger-fuentes-rss --strict

  p12-security:
    # Sin pull_request_target: nunca ejecutar código de forks con secretos del repositorio.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Comprobar permisos y rotación HTTP con secretos de CI
        env:
          HUMWORLD_API_KEY_READ: ${{ secrets.HUMWORLD_API_KEY_READ }}
          HUMWORLD_API_KEY_WRITE: ${{ secrets.HUMWORLD_API_KEY_WRITE }}
        run: npm run security:smoke
      - name: Publicar evidencia de acceso sin credenciales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprobaciones-acceso-p12
          path: backend/reports/p12/
          if-no-files-found: warn
          retention-days: 7
