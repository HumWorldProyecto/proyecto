name: humworld-cierre-demo
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: humworld
      POSTGRES_DB: humworld_demo_final
      # Solo fixtures locales, red de demo y puerto ligado a loopback.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55444:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humworld -d humworld_demo_final"]
      interval: 3s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://humworld@postgres:5432/humworld_demo_final?schema=public
      HUMWORLD_API_KEY_READ: ${HUMWORLD_API_KEY_READ:?Proporciona una clave de consulta exclusiva de demo}
      HUMWORLD_API_KEY_WRITE: ${HUMWORLD_API_KEY_WRITE:?Proporciona una clave de gestión exclusiva de demo}
    command: ["sh", "-c", "npx prisma migrate deploy && node scripts/demo-seed.cjs && node dist/main.js"]
    ports:
      - "127.0.0.1:53015:3000"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:3000
    ports:
      - "127.0.0.1:54175:4173"
    depends_on:
      - backend
