name: humworld-sprint4-demo
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: humworld
      POSTGRES_PASSWORD: ${HUMWORLD_DEMO_PASSWORD:?Define HUMWORLD_DEMO_PASSWORD para la base local de demostración}
      POSTGRES_DB: humworld_sprint4
    volumes:
      - sprint4-demo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humworld -d humworld_sprint4"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://humworld:${HUMWORLD_DEMO_PASSWORD}@postgres:5432/humworld_sprint4?schema=public
      HUMWORLD_API_KEY_READ: ${HUMWORLD_API_KEY_READ:?Define la clave de consulta del entorno local}
      HUMWORLD_API_KEY_WRITE: ${HUMWORLD_API_KEY_WRITE:?Define la clave de gestión del entorno local}
    ports:
      - "127.0.0.1:53000:3000"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:3000
    ports:
      - "127.0.0.1:54173:4173"
    depends_on:
      - backend
volumes:
  sprint4-demo-data:
